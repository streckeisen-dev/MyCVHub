spring:
  application.name: "MyCV"
  datasource:
    url: ${MYCV_DATASOURCE}
    username: ${MYCV_DB_USERNAME}
    password: ${MYCV_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      leak-detection-threshold: 5000

  jpa:
    generate-ddl: false
    open-in-view: false

  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml
    database-change-log-lock-table: databasechangeloglock
    database-change-log-table: databasechangelog
    default-schema: public

  servlet.multipart:
    max-request-size: 2MB
    max-file-size: 2MB

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
              - repo
            redirect-uri: "https://mycvhub.ch/api/auth/oauth2/callback/github"
            authorization-grant-type: authorization_code
            client-name: GitHub

  mail:
    host: smtp.eu.mailgun.org
    port: 587
    username: ${MAILGUN_SMTP_USERNAME}
    password: ${MAILGUN_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  lifecycle:
    timeout-per-shutdown-phase: 90s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

logging:
  file.name: /app/logs/mycv.log
  include-application-name: false
  logback:
    rollingpolicy:
      max-history: 5
      max-file-size: 5MB
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.log%i
  level:
    org.springframework.web: info
    org.hibernate: error
    ch.streckeisen.mycv.backend: info

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  url-expiration: 300

db-scheduler:
  enabled: true
  table-name: db_scheduler_scheduled_tasks
  scheduler-name: mycv-scheduler
  threads: 5
  shutdown-max-wait: 15m
  polling-interval: 1s
my-cv:
  security:
    cors:
      allowed-origins: ${MYCV_CORS_ALLOWED_ORIGINS:}
    jwt:
      access:
        secret: ${JWT_ACCESS_SECRET}
        expiration-time: 3600000
      refresh:
        secret: ${JWT_REFRESH_SECRET}
        expiration-time: 432000000
  account:
    verification:
      token-expiration-hours: 12
      token-generation-block-minutes: 30
  frontend:
    base-url: https://mycvhub.ch/ui
  github:
    api-base-url: https://api.github.com
